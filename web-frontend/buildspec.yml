version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.9
    commands:
      - pip install aws-sam-cli
      - curl -o kubectl https://amazon-eks.s3.us-west-2.amazonaws.com/1.21.2/2021-07-05/bin/linux/amd64/kubectl
      - chmod +x ./kubectl
      - mv ./kubectl /usr/local/bin
  build:
    commands:
      - cd web-frontend
      - |
        # Discover service endpoints automatically
        echo "🔍 Discovering service endpoints..."
        
        # Find NHL API Gateway URL
        NHL_API_ID=$(aws apigateway get-rest-apis --query "items[?contains(name, 'nhl-api-service')].id" --output text | head -1)
        if [ -n "$NHL_API_ID" ] && [ "$NHL_API_ID" != "None" ]; then
          NHL_API_URL="https://$NHL_API_ID.execute-api.$AWS_DEFAULT_REGION.amazonaws.com/prod/nhl-stats"
          echo "✅ Found NHL API: $NHL_API_URL"
        else
          NHL_API_URL="https://YOUR_NHL_API_GATEWAY_URL/prod/nhl-stats"
          echo "⚠️  NHL API not found, using placeholder"
        fi
        
        # Configure kubectl for EKS cluster
        aws eks update-kubeconfig --region $AWS_DEFAULT_REGION --name nhl-stats-cluster 2>/dev/null || echo "EKS cluster not accessible"
        
        # Find EKS LoadBalancer URL (try to get it, but don't fail if not available)
        EKS_LB_URL=$(kubectl get service stats-processing-service -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "")
        if [ -n "$EKS_LB_URL" ]; then
          EKS_URL="http://$EKS_LB_URL/process-stats"
          echo "✅ Found EKS service: $EKS_URL"
        else
          EKS_URL="http://YOUR_EKS_LOADBALANCER_URL/process-stats"
          echo "⚠️  EKS LoadBalancer not ready, using placeholder"
        fi
        
        # Export endpoints for SAM deployment
        echo "📝 Exporting endpoints for deployment..."
        export NHL_API_URL
        export EKS_URL
        echo "✅ Endpoints exported successfully"
      - |
        # Check and cleanup failed CloudFormation stack
        STACK_NAME="eks-nhl-test-web-frontend-stack"
        STACK_STATUS=$(aws cloudformation describe-stacks --stack-name $STACK_NAME --query 'Stacks[0].StackStatus' --output text 2>/dev/null || echo "NOT_EXISTS")
        
        if [[ "$STACK_STATUS" =~ ROLLBACK_FAILED|UPDATE_ROLLBACK_FAILED|DELETE_FAILED ]]; then
          echo "⚠️  Stack $STACK_NAME is in failed state: $STACK_STATUS"
          echo "🗑️  Force deleting stack..."
          aws cloudformation delete-stack --stack-name $STACK_NAME
          echo "⏳ Waiting for stack deletion..."
          aws cloudformation wait stack-delete-complete --stack-name $STACK_NAME || echo "Stack deletion completed or timed out"
        elif [[ "$STACK_STATUS" != "NOT_EXISTS" ]]; then
          echo "✅ Stack $STACK_NAME status: $STACK_STATUS"
        fi
      - sam build
      - sam package --s3-bucket $ARTIFACTS_BUCKET --output-template-file packaged-template.yaml
      - |
        # Deploy with discovered endpoints as parameters
        sam deploy --template-file packaged-template.yaml \
          --no-confirm-changeset --no-fail-on-empty-changeset \
          --stack-name eks-nhl-test-web-frontend-stack \
          --capabilities CAPABILITY_IAM \
          --parameter-overrides NHLApiEndpoint="${NHL_API_URL}" StatsProcessingEndpoint="${EKS_URL}"

artifacts:
  files:
    - web-frontend/packaged-template.yaml