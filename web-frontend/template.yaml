AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Parameters:
  NHLApiEndpoint:
    Type: String
    Default: 'https://YOUR_NHL_API_GATEWAY_URL/prod/nhl-stats'
    Description: NHL API Gateway endpoint
  StatsProcessingEndpoint:
    Type: String
    Default: 'http://YOUR_EKS_LOADBALANCER_URL/process-stats'
    Description: EKS Stats Processing service endpoint

Resources:
  WebFrontendFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: app.lambda_handler
      Runtime: python3.9
      Timeout: 30
      Environment:
        Variables:
          NHL_API_ENDPOINT: !Ref NHLApiEndpoint
          STATS_PROCESSING_ENDPOINT: !Ref StatsProcessingEndpoint
      Events:
        Api:
          Type: Api
          Properties:
            Path: /
            Method: get
        ProxyApi:
          Type: Api
          Properties:
            Path: /proxy/eks
            Method: get

Outputs:
  WebFrontendUrl:
    Description: "Web Frontend URL"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"