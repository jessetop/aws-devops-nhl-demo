version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - curl -o kubectl https://amazon-eks.s3.us-west-2.amazonaws.com/1.21.2/2021-07-05/bin/linux/amd64/kubectl
      - chmod +x ./kubectl
      - mv ./kubectl /usr/local/bin
  pre_build:
    commands:
      - echo "Configuring kubectl for EKS cluster"
      - aws eks update-kubeconfig --region $AWS_DEFAULT_REGION --name $CLUSTER_NAME
  build:
    commands:
      - echo "Deploying to EKS"
      - echo "Substituting ECR image details..."
      - sed "s/ACCOUNT_ID/$AWS_ACCOUNT_ID/g" stats-processing-service/k8s-deployment.yaml > /tmp/k8s-deployment.yaml
      - sed -i "s/REGION/$AWS_DEFAULT_REGION/g" /tmp/k8s-deployment.yaml
      - sed -i "s/stats-processing/$ECR_REPOSITORY_NAME/g" /tmp/k8s-deployment.yaml
      - echo "Final deployment file:"
      - cat /tmp/k8s-deployment.yaml
      - kubectl apply -f /tmp/k8s-deployment.yaml
      - kubectl rollout status deployment/stats-processing
  post_build:
    commands:
      - echo "Deployment completed"
      - kubectl get services stats-processing-service