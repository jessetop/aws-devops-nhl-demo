version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.8
    commands:
      - curl -o kubectl https://amazon-eks.s3.us-west-2.amazonaws.com/1.21.2/2021-07-05/bin/linux/amd64/kubectl
      - chmod +x ./kubectl
      - mv ./kubectl /usr/local/bin
  pre_build:
    commands:
      - echo "Updating kubeconfig for cluster $CLUSTER_NAME in region $AWS_DEFAULT_REGION"
      - ROLE_ARN=$(aws sts get-caller-identity --query Arn --output text)
      - echo "CodeBuild Role ARN: $ROLE_ARN"
      - aws eks create-access-entry --cluster-name $CLUSTER_NAME --principal-arn $ROLE_ARN --type STANDARD || echo "Access entry already exists"
      - aws eks associate-access-policy --cluster-name $CLUSTER_NAME --principal-arn $ROLE_ARN --policy-arn arn:aws:eks::aws:cluster-access-policy/AmazonEKSEditPolicy --access-scope type=cluster || echo "Policy already associated"
      - aws eks update-kubeconfig --region $AWS_DEFAULT_REGION --name $CLUSTER_NAME
  build:
    commands:
      - echo "Deploying to EKS..."
      - kubectl apply -f stats-processing-service/k8s-deployment.yaml
      - kubectl rollout status deployment/stats-processing
  post_build:
    commands:
      - echo "Deployment completed"
      - kubectl get services stats-processing-service