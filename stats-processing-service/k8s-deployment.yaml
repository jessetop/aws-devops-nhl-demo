apiVersion: apps/v1
kind: Deployment
metadata:
  name: stats-processing
spec:
  replicas: 2
  selector:
    matchLabels:
      app: stats-processing
  template:
    metadata:
      labels:
        app: stats-processing
    spec:
      containers:
      - name: stats-processing
        image: ACCOUNT_ID.dkr.ecr.REGION.amazonaws.com/stats-processing:latest
        ports:
        - containerPort: 5000
        env:
        - name: NHL_API_URL
          value: "https://statsapi.web.nhl.com/api/v1/teams"
---
apiVersion: v1
kind: Service
metadata:
  name: stats-processing-service
spec:
  selector:
    app: stats-processing
  ports:
  - port: 80
    targetPort: 5000
  type: LoadBalancer