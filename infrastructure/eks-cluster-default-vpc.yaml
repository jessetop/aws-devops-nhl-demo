# EKS Cluster configuration for eksctl - Default VPC version (for testing/dev)
# Uses existing default VPC instead of creating new networking resources

apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: eks-nhl-test-cluster
  region: us-east-1

# Kubernetes version (will be updated dynamically)
kubernetesVersion: "1.32"

# Use default VPC - much faster for testing
vpc:
  subnets:
    public:
      us-east-1a: { id: "auto" }
      us-east-1b: { id: "auto" }

# Node groups
nodeGroups:
  - name: eks-nhl-test-eks-nodes
    instanceType: t3.small
    desiredCapacity: 2
    minSize: 1
    maxSize: 3
    volumeSize: 20
    ssh:
      allow: false
    iam:
      withAddonPolicies:
        imageBuilder: true
        autoScaler: true
        ebs: true
        efs: true
        albIngress: true
        cloudWatch: true

# Add-ons (eksctl installs these automatically)
addons:
  - name: vpc-cni
  - name: coredns
  - name: kube-proxy
  - name: aws-ebs-csi-driver