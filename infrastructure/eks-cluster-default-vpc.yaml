# EKS Cluster configuration for eksctl - Default VPC version (for testing/dev)
# Uses existing default VPC instead of creating new networking resources

apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: nhl-stats-cluster
  region: us-east-1

# Kubernetes version (will be updated dynamically)
# kubernetesVersion: "1.30"

# Use default VPC - much faster for testing
vpc:
  id: "auto"  # eksctl will find and use default VPC
  subnets:
    public:
      auto: true  # Use default public subnets
    private:
      auto: true  # Use default private subnets (if available)

# Node groups
nodeGroups:
  - name: nhl-stats-eks-nodes
    instanceType: t3.medium
    desiredCapacity: 2
    minSize: 1
    maxSize: 3
    volumeSize: 20
    ssh:
      allow: false
    iam:
      withAddonPolicies:
        imageBuilder: true
        autoScaler: true
        ebs: true
        efs: true
        albIngress: true
        cloudWatch: true

# Add-ons (eksctl installs these automatically)
addons:
  - name: vpc-cni
  - name: coredns
  - name: kube-proxy
  - name: aws-ebs-csi-driver

# CloudWatch logging
cloudWatch:
  clusterLogging:
    enable: ["audit", "authenticator", "controllerManager"]