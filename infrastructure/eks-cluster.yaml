# EKS Cluster configuration for eksctl
# This replaces the CloudFormation template for simpler cluster management

apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: nhl-stats-cluster
  region: us-east-1
  # version: "1.30"

# VPC configuration - eksctl will create VPC automatically
vpc:
  cidr: 10.0.0.0/16
  nat:
    gateway: Single

# Node groups
nodeGroups:
  - name: nhl-stats-eks-nodes
    instanceType: t3.medium
    desiredCapacity: 2
    minSize: 1
    maxSize: 3
    volumeSize: 20
    ssh:
      allow: false
    iam:
      withAddonPolicies:
        imageBuilder: true
        autoScaler: true
        ebs: true
        efs: true
        albIngress: true
        cloudWatch: true

# Add-ons (eksctl installs these automatically)
addons:
  - name: vpc-cni
  - name: coredns
  - name: kube-proxy
  - name: aws-ebs-csi-driver