AWSTemplateFormatVersion: '2010-09-09'
Description: 'GitHub OIDC Role for secure deployments (OIDC provider created via CLI)'

Parameters:
  GitHubOrg:
    Type: String
    Description: 'GitHub organization or username'
  GitHubRepo:
    Type: String
    Description: 'GitHub repository name'

Resources:
  # Note: OIDC Provider created via CLI because AWS::IAM::OIDCIdentityProvider 
  # resource type is not available in all AWS regions
  GitHubActionsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: GitHubActionsRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub 'arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                'token.actions.githubusercontent.com:aud': sts.amazonaws.com
              StringLike:
                'token.actions.githubusercontent.com:sub': !Sub 'repo:${GitHubOrg}/${GitHubRepo}:*'
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/PowerUserAccess
      Policies:
        - PolicyName: SAMDeployPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:AttachRolePolicy
                  - iam:PassRole
                Resource: '*'

Outputs:
  RoleArn:
    Description: 'GitHub Actions Role ARN'
    Value: !GetAtt GitHubActionsRole.Arn