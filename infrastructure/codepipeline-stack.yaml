AWSTemplateFormatVersion: '2010-09-09'
Description: 'CodePipeline infrastructure for NHL Stats Demo'

Parameters:
  GitHubRepo:
    Type: String
    Default: 'jessetop/aws-devops-nhl-demo'
  GitHubBranch:
    Type: String
    Default: 'trunk'
  GitHubToken:
    Type: String
    NoEcho: true
  StackName:
    Type: String
    Default: 'nhl-stats'
    Description: 'Stack name prefix for unique resource naming'
  CreateECRRepository:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: 'Whether to create ECR repository (set to false if it already exists)'
  CreateS3Bucket:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: 'Whether to create S3 bucket (set to false if it already exists)'

Conditions:
  ShouldCreateECR: !Equals [!Ref CreateECRRepository, 'true']
  ShouldCreateS3: !Equals [!Ref CreateS3Bucket, 'true']

Resources:
  # S3 Bucket for artifacts
  ArtifactsBucket:
    Type: AWS::S3::Bucket
    Condition: ShouldCreateS3
    DeletionPolicy: Retain
    Properties:
      BucketName: !Sub '${StackName}-artifacts-${AWS::AccountId}'
      VersioningConfiguration:
        Status: Enabled

  # ECR Repository for Stats Processing Service
  StatsProcessingECR:
    Type: AWS::ECR::Repository
    Condition: ShouldCreateECR
    DeletionPolicy: Retain
    Properties:
      RepositoryName: !Sub '${StackName}-stats-processing'

  # CodeBuild Project for Stats Processing
  StatsProcessingBuild:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${StackName}-stats-processing-build'
      ServiceRole: !GetAtt CodeBuildRole.Arn
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_MEDIUM
        Image: aws/codebuild/standard:5.0
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: AWS_DEFAULT_REGION
            Value: !Ref AWS::Region
          - Name: AWS_ACCOUNT_ID
            Value: !Ref AWS::AccountId
          - Name: ECR_REPOSITORY_NAME
            Value: !Sub '${StackName}-stats-processing'
      Source:
        Type: CODEPIPELINE
        BuildSpec: stats-processing-service/buildspec.yml

  # CodeBuild Project for Stats Processing EKS Deploy
  StatsProcessingDeploy:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${StackName}-stats-processing-deploy'
      ServiceRole: !GetAtt CodeBuildRole.Arn
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_MEDIUM
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
        EnvironmentVariables:
          - Name: AWS_DEFAULT_REGION
            Value: !Ref AWS::Region
          - Name: AWS_ACCOUNT_ID
            Value: !Ref AWS::AccountId
          - Name: ECR_REPOSITORY_NAME
            Value: !Sub '${StackName}-stats-processing'
          - Name: CLUSTER_NAME
            Value: !Sub '${StackName}-cluster'
      Source:
        Type: CODEPIPELINE
        BuildSpec: stats-processing-service/deploy-buildspec.yml

  # CodeBuild Project for Web Frontend
  WebFrontendBuild:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${StackName}-web-frontend-build'
      ServiceRole: !GetAtt CodeBuildRole.Arn
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_MEDIUM
        Image: aws/codebuild/standard:5.0
        EnvironmentVariables:
          - Name: ARTIFACTS_BUCKET
            Value: !If [ShouldCreateS3, !Ref ArtifactsBucket, !Sub '${StackName}-artifacts-${AWS::AccountId}']
      Source:
        Type: CODEPIPELINE
        BuildSpec: web-frontend/buildspec.yml

  # CodeBuild Project for Updating Web Frontend Endpoints
  WebFrontendUpdateEndpoints:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${StackName}-web-frontend-update-endpoints'
      ServiceRole: !GetAtt CodeBuildRole.Arn
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:5.0
        EnvironmentVariables:
          - Name: STACK_NAME
            Value: !Sub '${StackName}'
      Source:
        Type: CODEPIPELINE
        BuildSpec: |
          version: 0.2
          phases:
            install:
              runtime-versions:
                python: 3.9
              commands:
                - curl -o kubectl https://amazon-eks.s3.us-west-2.amazonaws.com/1.21.2/2021-07-05/bin/linux/amd64/kubectl
                - chmod +x ./kubectl
                - mv ./kubectl /usr/local/bin
            build:
              commands:
                - |
                  echo "🔍 Discovering service endpoints..."
                  
                  # Find NHL API Gateway URL
                  NHL_API_ID=$(aws apigateway get-rest-apis --query "items[?contains(name, 'nhl-api-service')].id" --output text | head -1)
                  if [ -n "$NHL_API_ID" ] && [ "$NHL_API_ID" != "None" ]; then
                    NHL_API_URL="https://$NHL_API_ID.execute-api.$AWS_DEFAULT_REGION.amazonaws.com/prod/nhl-stats"
                    echo "✅ Found NHL API: $NHL_API_URL"
                  else
                    NHL_API_URL="https://YOUR_NHL_API_GATEWAY_URL/prod/nhl-stats"
                    echo "⚠️  NHL API not found, using placeholder"
                  fi
                  
                  # Configure kubectl for EKS cluster
                  aws eks update-kubeconfig --region $AWS_DEFAULT_REGION --name ${STACK_NAME}-cluster 2>/dev/null || echo "EKS cluster not accessible"
                  
                  # Find EKS LoadBalancer URL
                  EKS_LB_URL=$(kubectl get service stats-processing-service -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "")
                  if [ -n "$EKS_LB_URL" ]; then
                    EKS_URL="http://$EKS_LB_URL/process-stats"
                    echo "✅ Found EKS service: $EKS_URL"
                  else
                    EKS_URL="http://YOUR_EKS_LOADBALANCER_URL/process-stats"
                    echo "⚠️  EKS LoadBalancer not ready, using placeholder"
                  fi
                  
                  # Find Lambda function name
                  LAMBDA_FUNCTION=$(aws cloudformation describe-stack-resources --stack-name ${STACK_NAME}-web-frontend-stack --query "StackResources[?ResourceType=='AWS::Lambda::Function'].PhysicalResourceId" --output text)
                  
                  if [ -n "$LAMBDA_FUNCTION" ]; then
                    echo "📝 Updating Lambda environment variables..."
                    aws lambda update-function-configuration \
                      --function-name $LAMBDA_FUNCTION \
                      --environment Variables="{NHL_API_ENDPOINT=$NHL_API_URL,STATS_PROCESSING_ENDPOINT=$EKS_URL}" \
                      --region $AWS_DEFAULT_REGION
                    echo "✅ Lambda environment variables updated"
                  else
                    echo "⚠️  Lambda function not found"
                  fi

  # CodePipeline for Stats Processing Service
  StatsProcessingPipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Sub '${StackName}-stats-processing-pipeline'
      RoleArn: !GetAtt CodePipelineRole.Arn
      ArtifactStore:
        Type: S3
        Location: !If [ShouldCreateS3, !Ref ArtifactsBucket, !Sub '${StackName}-artifacts-${AWS::AccountId}']
      Stages:
        - Name: Source
          Actions:
            - Name: Source
              ActionTypeId:
                Category: Source
                Owner: ThirdParty
                Provider: GitHub
                Version: 1
              Configuration:
                Owner: !Select [0, !Split ['/', !Ref GitHubRepo]]
                Repo: !Select [1, !Split ['/', !Ref GitHubRepo]]
                Branch: !Ref GitHubBranch
                OAuthToken: !Ref GitHubToken
              OutputArtifacts:
                - Name: SourceOutput
        - Name: Build
          Actions:
            - Name: Build
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: 1
              Configuration:
                ProjectName: !Ref StatsProcessingBuild
              InputArtifacts:
                - Name: SourceOutput
              OutputArtifacts:
                - Name: BuildOutput
        - Name: Deploy
          Actions:
            - Name: DeployToEKS
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: 1
              Configuration:
                ProjectName: !Ref StatsProcessingDeploy
              InputArtifacts:
                - Name: SourceOutput

  # CodePipeline for Web Frontend
  WebFrontendPipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Sub '${StackName}-web-frontend-pipeline'
      RoleArn: !GetAtt CodePipelineRole.Arn
      ArtifactStore:
        Type: S3
        Location: !If [ShouldCreateS3, !Ref ArtifactsBucket, !Sub '${StackName}-artifacts-${AWS::AccountId}']
      Stages:
        - Name: Source
          Actions:
            - Name: Source
              ActionTypeId:
                Category: Source
                Owner: ThirdParty
                Provider: GitHub
                Version: 1
              Configuration:
                Owner: !Select [0, !Split ['/', !Ref GitHubRepo]]
                Repo: !Select [1, !Split ['/', !Ref GitHubRepo]]
                Branch: !Ref GitHubBranch
                OAuthToken: !Ref GitHubToken
              OutputArtifacts:
                - Name: SourceOutput
        - Name: Build
          Actions:
            - Name: Build
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: 1
              Configuration:
                ProjectName: !Ref WebFrontendBuild
              InputArtifacts:
                - Name: SourceOutput
              OutputArtifacts:
                - Name: BuildOutput
        - Name: Deploy
          Actions:
            - Name: Deploy
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CloudFormation
                Version: 1
              Configuration:
                ActionMode: CREATE_UPDATE
                StackName: !Sub '${StackName}-web-frontend-stack'
                TemplatePath: BuildOutput::web-frontend/packaged-template.yaml
                ParameterOverrides: BuildOutput::web-frontend/parameters.json
                Capabilities: CAPABILITY_IAM,CAPABILITY_AUTO_EXPAND
                RoleArn: !GetAtt CloudFormationRole.Arn
              InputArtifacts:
                - Name: BuildOutput
            - Name: UpdateEndpoints
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: 1
              Configuration:
                ProjectName: !Ref WebFrontendUpdateEndpoints
              InputArtifacts:
                - Name: SourceOutput
              RunOrder: 2

  # IAM Roles
  CodeBuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AWSCodeBuildDeveloperAccess
      Policies:
        - PolicyName: ECRAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ecr:*
                  - s3:*
                  - logs:*
                  - eks:DescribeCluster
                  - eks:ListClusters
                  - eks:DescribeNodegroup
                  - eks:ListNodegroups
                  - eks:AccessKubernetesApi
                  - lambda:UpdateFunctionConfiguration
                  - lambda:GetFunction
                  - apigateway:GET
                  - cloudformation:DescribeStackResources
                Resource: '*'
              - Effect: Allow
                Action:
                  - sts:GetCallerIdentity
                Resource: '*'

  CodePipelineRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PipelineAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:*
                  - codebuild:*
                  - cloudformation:*
                  - iam:PassRole
                Resource: '*'

  CloudFormationRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AdministratorAccess

Outputs:
  ArtifactsBucket:
    Description: S3 Bucket for pipeline artifacts
    Value: !If [ShouldCreateS3, !Ref ArtifactsBucket, !Sub '${StackName}-artifacts-${AWS::AccountId}']
  
  StatsProcessingECR:
    Description: ECR Repository for Stats Processing Service
    Value: !If [ShouldCreateECR, !GetAtt StatsProcessingECR.RepositoryUri, !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${StackName}-stats-processing']