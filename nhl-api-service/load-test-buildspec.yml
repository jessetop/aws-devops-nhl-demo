version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto11
    commands:
      - echo "Installing JMeter..."
      - wget -q https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.4.1.tgz
      - tar -xzf apache-jmeter-5.4.1.tgz
      - export PATH=$PATH:$PWD/apache-jmeter-5.4.1/bin
  
  build:
    commands:
      - echo "Running JMeter load test..."
      - apache-jmeter-5.4.1/bin/jmeter -n -t load-test.jmx -JAPI_URL=$API_ENDPOINT_URL -l jmeter-results.jtl
      - echo "Load test completed"
      - cat jmeter-results.jtl

artifacts:
  files:
    - jmeter-results.jtl
    - load-test.jmx