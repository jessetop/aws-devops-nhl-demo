name: Deploy NHL API Service

on:
  push:
    branches: [ trunk ]
    paths: [ 'nhl-api-service/**' ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
    - uses: actions/checkout@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Auto-increment version
      run: |
        cd nhl-api-service
        CURRENT_VERSION=$(cat version.txt)
        NEW_VERSION=$((CURRENT_VERSION + 1))
        echo $NEW_VERSION > version.txt
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add version.txt
        git commit -m "Auto-increment version to $NEW_VERSION [skip ci]" || exit 0
        git push || exit 0
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        cache: 'pip'
    
    - name: Cache SAM CLI
      uses: actions/cache@v3
      with:
        path: ~/.aws-sam
        key: ${{ runner.os }}-sam-${{ hashFiles('**/template.yaml') }}
        restore-keys: |
          ${{ runner.os }}-sam-
    
    - name: Setup SAM CLI
      uses: aws-actions/setup-sam@v2
      with:
        use-installer: true
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        role-session-name: GitHubActions
        aws-region: ca-central-1
    
    - name: Build and Deploy
      working-directory: ./nhl-api-service
      run: |
        sam build
        sam deploy --no-confirm-changeset --no-fail-on-empty-changeset --stack-name nhl-api-service --capabilities CAPABILITY_IAM --resolve-s3